<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Video hooks to Google Sheets: source connection map</title>
<desc id="desc">Run manually, Set videos to analyze, Analyze videos with Apify, Classify Apify results, and Successful content form the input path. The true branch formats one row per video and appends rows to Google Sheet. The false branch ends at Errors - inspect before retry. This is an illustration, not a screenshot or live run.</desc>
